name: CI

on:
  push:
    branches: [main, 'assignment-*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: week9_auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: week9_auth_ci
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-real
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Challenge X1. Most of the code shipping to production came from
      # node_modules, and a known-vulnerable package is the easiest way
      # in. Fails the build on a high-severity advisory rather than just
      # warning about it.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run migrations
        run: npm run migration:run

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e
